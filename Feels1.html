function obtenerSinRepetir(lista, usadas){
if(lista.length===usadas.length){ usadas.length=0; }
let disponibles=lista.filter(x=>!usadas.includes(x));
let elegido=disponibles[Math.floor(Math.random()*disponibles.length)];
usadas.push(elegido);
return elegido;
}

function mostrar(emocion){
let data=datos[emocion];
let frase=obtenerSinRepetir(data.frases,data.frasesUsadas);
let cancion=obtenerSinRepetir(data.canciones,data.cancionesUsadas);

document.getElementById("resultado").innerHTML=`
<h2>${frase}</h2>
<iframe src="${cancion}" width="300" height="152"></iframe>
`;
}
